syntax = "proto3";

package pb.merchant_award;

option java_multiple_files = true;
option java_package = "com.sanedge.ecommerce.pb.merchant_award";

import "merchant_award/merchant_award_common.proto";
import "merchant/merchant_query.proto";

option go_package = "github.com/MamangRust/monolith-ecommerce-shared/pb";

service MerchantAwardQueryService {
    rpc FindAll(pb.merchant.FindAllMerchantRequest) returns (ApiResponsePaginationMerchantAward);
    rpc FindById(FindByIdMerchantAwardRequest) returns (ApiResponseMerchantAward);

    rpc FindByActive(pb.merchant.FindAllMerchantRequest) returns (ApiResponsePaginationMerchantAwardDeleteAt);
    rpc FindByTrashed(pb.merchant.FindAllMerchantRequest) returns (ApiResponsePaginationMerchantAwardDeleteAt);
}
