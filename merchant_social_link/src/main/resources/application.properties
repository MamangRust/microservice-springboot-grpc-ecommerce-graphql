spring.application.name=merchant-social-link-service
spring.datasource.url=jdbc:postgresql://${MERCHANT_SOCIAL_LINK_DB_HOST:localhost}:${MERCHANT_SOCIAL_LINK_DB_PORT:5433}/${MERCHANT_SOCIAL_LINK_DB_NAME:example_jpa_ecommerce}
spring.datasource.username=${MERCHANT_SOCIAL_LINK_DB_USER:postgres}
spring.datasource.password=${MERCHANT_SOCIAL_LINK_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9108

