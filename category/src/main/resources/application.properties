spring.application.name=category-service
spring.datasource.url=jdbc:postgresql://${CATEGORY_DB_HOST:localhost}:${CATEGORY_DB_PORT:5433}/${CATEGORY_DB_NAME:example_jpa_ecommerce}
spring.datasource.username=${CATEGORY_DB_USER:postgres}
spring.datasource.password=${CATEGORY_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9109

