spring.application.name=stats-backfill
spring.main.web-application-type=none

# ---- Source PostgreSQL (transaction service DB) ----
backfill.source.url=jdbc:postgresql://${TRANSACTION_DB_HOST:localhost}:${TRANSACTION_DB_PORT:5433}/${TRANSACTION_DB_NAME:example_jpa_ecommerce}
backfill.source.user=${TRANSACTION_DB_USER:postgres}
backfill.source.password=${TRANSACTION_DB_PASSWORD:postgres}

# Aggregate query run against the source DB. Adjust to the real transaction schema.
backfill.sql=SELECT to_char(created_at, 'YYYY-MM') AS period, \
  COALESCE(merchant_id, 0) AS merchant_id, COALESCE(product_id, 0) AS product_id, \
  SUM(total_amount) AS revenue FROM transactions GROUP BY 1, 2, 3

# ---- ClickHouse (target) ----
clickhouse.url=jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DB:default}
clickhouse.username=${CLICKHOUSE_USER:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:}
