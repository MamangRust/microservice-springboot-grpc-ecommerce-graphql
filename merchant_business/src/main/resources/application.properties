spring.application.name=merchant-business-service
spring.datasource.url=jdbc:postgresql://${MERCHANT_BUSINESS_DB_HOST:localhost}:${MERCHANT_BUSINESS_DB_PORT:5433}/${MERCHANT_BUSINESS_DB_NAME:example_jpa_ecommerce}
spring.datasource.username=${MERCHANT_BUSINESS_DB_USER:postgres}
spring.datasource.password=${MERCHANT_BUSINESS_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9105

# gRPC client (merchant service)
grpc.client.merchant.host=localhost
grpc.client.merchant.port=9103

# JWT
springjwt.app.jwtSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31
springjwt.app.jwtRefreshSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32
springjwt.app.jwtExpirationMs=86400000
springjwt.app.jwtRefreshExpirationMs=86400000
