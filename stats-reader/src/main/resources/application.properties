spring.application.name=stats-reader

# ---- gRPC server (served via common GrpcServerLifecycle) ----
grpc.server.port=9121

# ---- Actuator / observability ----
management.server.port=9321
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ---- ClickHouse (read side) ----
clickhouse.url=jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DB:default}
clickhouse.username=${CLICKHOUSE_USER:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:}

# ---- Redis (query cache) ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# ---- Tracing ----
management.otlp.tracing.endpoint=http://localhost:4317
management.tracing.sampling.probability=1.0
