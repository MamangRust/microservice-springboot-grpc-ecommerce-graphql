spring.application.name=shipping-address-service
spring.datasource.url=jdbc:postgresql://${SHIPPING_ADDRESS_DB_HOST:localhost}:${SHIPPING_ADDRESS_DB_PORT:5433}/${SHIPPING_ADDRESS_DB_NAME:example_jpa_ecommerce}
spring.datasource.username=${SHIPPING_ADDRESS_DB_USER:postgres}
spring.datasource.password=${SHIPPING_ADDRESS_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9118

