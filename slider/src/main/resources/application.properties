spring.application.name=slider-service
spring.datasource.url=jdbc:postgresql://${SLIDER_DB_HOST:localhost}:${SLIDER_DB_PORT:5433}/${SLIDER_DB_NAME:example_jpa_ecommerce}
spring.datasource.username=${SLIDER_DB_USER:postgres}
spring.datasource.password=${SLIDER_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9112

