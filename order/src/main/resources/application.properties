spring.application.name=order-service
spring.datasource.url=jdbc:postgresql://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:5433}/${ORDER_DB_NAME:example_jpa_ecommerce}
spring.datasource.username=${ORDER_DB_USER:postgres}
spring.datasource.password=${ORDER_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9114

# gRPC client -> merchant service
grpc.client.merchant.host=${MERCHANT_SERVICE_HOST:localhost}
grpc.client.merchant.port=${MERCHANT_SERVICE_PORT:9103}

# gRPC client -> product service
grpc.client.product.host=${PRODUCT_SERVICE_HOST:localhost}
grpc.client.product.port=${PRODUCT_SERVICE_PORT:9110}

# gRPC client -> order-item service
grpc.client.order-item.host=${ORDER_ITEM_SERVICE_HOST:localhost}
grpc.client.order-item.port=${ORDER_ITEM_SERVICE_PORT:9115}

# gRPC client -> shipping-address service
grpc.client.shipping-address.host=${SHIPPING_ADDRESS_SERVICE_HOST:localhost}
grpc.client.shipping-address.port=${SHIPPING_ADDRESS_SERVICE_PORT:9118}

# gRPC client -> user service
grpc.client.user.host=${USER_SERVICE_HOST:localhost}
grpc.client.user.port=${USER_SERVICE_PORT:9102}

# JWT
springjwt.app.jwtSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31
springjwt.app.jwtRefreshSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32
springjwt.app.jwtExpirationMs=86400000
springjwt.app.jwtRefreshExpirationMs=86400000
