spring.application.name=auth-service
spring.datasource.url=jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5433}/${AUTH_DB_NAME:example_jpa_ecommerce}
spring.datasource.username=${AUTH_DB_USER:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9120

# gRPC client -> user service
grpc.client.user.host=${USER_SERVICE_HOST:localhost}
grpc.client.user.port=${USER_SERVICE_PORT:9102}

# gRPC client -> role service
grpc.client.role.host=${ROLE_SERVICE_HOST:localhost}
grpc.client.role.port=${ROLE_SERVICE_PORT:9101}

# ---- Kafka (transactional outbox relay) ----
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
kafka.acks=${KAFKA_ACKS:all}
kafka.enable.idempotence=${KAFKA_ENABLE_IDEMPOTENCE:true}
kafka.retries=${KAFKA_RETRIES:10}
kafka.retry.backoff.ms=${KAFKA_RETRY_BACKOFF_MS:500}
kafka.max.in.flight.requests.per.connection=${KAFKA_MAX_IN_FLIGHT:5}
kafka.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:120000}
kafka.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:30000}
kafka.compression.type=${KAFKA_COMPRESSION_TYPE:lz4}
kafka.linger.ms=${KAFKA_LINGER_MS:5}
kafka.batch.size=${KAFKA_BATCH_SIZE:16384}
kafka.max.block.ms=${KAFKA_MAX_BLOCK_MS:60000}

# Outbox relay tuning + lease
app.outbox.poll-ms=${AUTH_OUTBOX_POLL_MS:1000}
app.outbox.initial-delay-ms=${AUTH_OUTBOX_INITIAL_DELAY_MS:5000}
auth.outbox.batch-size=${AUTH_OUTBOX_BATCH_SIZE:50}
auth.outbox.lease.seconds=${AUTH_OUTBOX_LEASE_SECONDS:300}

# ---- Redis (verification codes, replaces quarkus.redis.*) ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
springjwt.app.jwtSecret=${JWT_SECRET:0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31}
springjwt.app.jwtRefreshSecret=${JWT_REFRESH_SECRET:0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32}
springjwt.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
springjwt.app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:86400000}
