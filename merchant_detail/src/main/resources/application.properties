spring.application.name=merchant-detail-service
spring.datasource.url=jdbc:postgresql://${MERCHANT_DETAIL_DB_HOST:localhost}:${MERCHANT_DETAIL_DB_PORT:5433}/${MERCHANT_DETAIL_DB_NAME:example_jpa_ecommerce}
spring.datasource.username=${MERCHANT_DETAIL_DB_USER:postgres}
spring.datasource.password=${MERCHANT_DETAIL_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9106

