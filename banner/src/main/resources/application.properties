spring.application.name=banner-service
spring.datasource.url=jdbc:postgresql://${BANNER_DB_HOST:localhost}:${BANNER_DB_PORT:5433}/${BANNER_DB_NAME:example_jpa_ecommerce}
spring.datasource.username=${BANNER_DB_USER:postgres}
spring.datasource.password=${BANNER_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9111

