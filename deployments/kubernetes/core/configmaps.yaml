apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ecommerce
data:
  APP_ENV: "kubernetes"
  # 1 database = 1 bounded context: tiap context punya instance PostgreSQL
  # sendiri (database/postgres-*.yaml) di belakang PgBouncer-nya sendiri
  # (database/pgbouncer-*.yaml). Prefix dipilih lewat Config.DBCluster di
  # service/<svc>/cmd/main.go (lihat pkg/database/names.go).
  DB_DRIVER: "postgres"
  DB_MAX_OPEN_CONNS: "10"
  DB_MIN_IDLE_CONNS: "2"
  DB_CONN_MAX_LIFETIME: "30m"
  DB_IDENTITY_HOST: "pgbouncer-identity.ecommerce.svc.cluster.local"
  DB_IDENTITY_PORT: "5432"
  DB_IDENTITY_NAME: "ec_identity"
  DB_MERCHANT_HOST: "pgbouncer-merchant.ecommerce.svc.cluster.local"
  DB_MERCHANT_PORT: "5432"
  DB_MERCHANT_NAME: "ec_merchant"
  DB_CATALOG_HOST: "pgbouncer-catalog.ecommerce.svc.cluster.local"
  DB_CATALOG_PORT: "5432"
  DB_CATALOG_NAME: "ec_catalog"
  DB_SALES_HOST: "pgbouncer-sales.ecommerce.svc.cluster.local"
  DB_SALES_PORT: "5432"
  DB_SALES_NAME: "ec_sales"
  DB_EXPERIENCE_HOST: "pgbouncer-experience.ecommerce.svc.cluster.local"
  DB_EXPERIENCE_PORT: "5432"
  DB_EXPERIENCE_NAME: "ec_experience"
  DB_EMAIL_HOST: "pgbouncer-email.ecommerce.svc.cluster.local"
  DB_EMAIL_PORT: "5432"
  DB_EMAIL_NAME: "ec_email"

  # ---- Per-module DB wiring (Spring Boot services read <MODULE>_DB_*) ----
  # Database-per-bounded-context: each domain service owns its database inside
  # its context, reached through that context's PgBouncer. Mirrors Planning.md
  # §6 / §12.2. The keys below are consumed by every service's
  # src/main/resources/application.properties:
  #   spring.datasource.url=jdbc:postgresql://${<MODULE>_DB_HOST}:${<MODULE>_DB_PORT}/${<MODULE>_DB_NAME}
  #   spring.datasource.username=${<MODULE>_DB_USER}
  #   spring.datasource.password=${<MODULE>_DB_PASSWORD}
  # Credentials are the cluster-wide Postgres superuser (same values the
  # PgBouncer poolers use from app-secrets); move to a Secret if tighter
  # isolation is required.
  # identity context → pgbouncer-identity / ec_identity
  ROLE_DB_HOST: "pgbouncer-identity.ecommerce.svc.cluster.local"
  ROLE_DB_PORT: "5432"
  ROLE_DB_NAME: "ec_identity"
  ROLE_DB_USER: "DRAGON"
  ROLE_DB_PASSWORD: "DRAGON"
  USER_DB_HOST: "pgbouncer-identity.ecommerce.svc.cluster.local"
  USER_DB_PORT: "5432"
  USER_DB_NAME: "ec_identity"
  USER_DB_USER: "DRAGON"
  USER_DB_PASSWORD: "DRAGON"
  AUTH_DB_HOST: "pgbouncer-identity.ecommerce.svc.cluster.local"
  AUTH_DB_PORT: "5432"
  AUTH_DB_NAME: "ec_identity"
  AUTH_DB_USER: "DRAGON"
  AUTH_DB_PASSWORD: "DRAGON"
