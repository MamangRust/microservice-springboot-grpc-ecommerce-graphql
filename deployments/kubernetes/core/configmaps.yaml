  # Stats pipeline (ClickHouse + stats-reader gRPC). CLICKHOUSE_PASSWORD is
  # injected from app-secrets, never stored here. The Spring Boot services read
  # `clickhouse.url`/`clickhouse.username` (set explicitly per Deployment),
  # which relaxed binding also maps from CLICKHOUSE_USERNAME/PASSWORD.
  CLICKHOUSE_ADDR: "clickhouse.ecommerce.svc.cluster.local:9000"
  CLICKHOUSE_DATABASE: "ecommerce"
  CLICKHOUSE_USERNAME: "dragon"
  GRPC_STATS_READER_ADDR: "stats-reader.ecommerce.svc.cluster.local:9121"
  STATS_READER_LISTEN_ADDR: ":9121"
  GRPC_STATS_READER_PORT: "9121"

  # Gateway downstream gRPC client addresses. The Spring Boot gateway
  # reads grpc.client.<name>.host/port (GrpcClientConfig @Value), which
  # relaxed-binding maps from env GRPC_CLIENT_<NAME>_HOST/_PORT.
  # Service DNS + real gRPC port (9101-9121) per Planning.md §13.
  GRPC_CLIENT_AUTH_HOST: "auth.ecommerce.svc.cluster.local"
