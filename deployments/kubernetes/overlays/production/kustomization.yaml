# GHCR image owner templating.
#
# The base manifests reference images as ghcr.io/__GHCR_OWNER__/springboot-ecommerce/<svc>.
# The `images` block above matches that placeholder (so newTag is pinned here),
# and this `replacements` block substitutes the real owner (from the app-config
# ConfigMap key GHCR_OWNER) into the <owner> segment of each image field.
# GHCR_OWNER must match github.repository_owner (lowercase) of the repository
# whose CI pushes to ghcr.io/<owner>/springboot-ecommerce/... — on a fork, only this
# ConfigMap value needs to change.
replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.GHCR_OWNER
    targets:
      - select:
          kind: Deployment
          name: "^(apigateway|auth|banner|cart|category|email|merchant|merchant-award|merchant-business|merchant-detail|merchant-policy|merchant-social-link|order|order-item|product|review|review-detail|role|shipping-address|slider|stats-reader|stats-writer|transaction|user)$"
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: "/"
          index: 1
      - select:
          kind: Job
          name: "^(migrate|stats-backfill)$"
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: "/"
          index: 1

components:
  - ../../components/image-pull-secret

patches:
  - path: migration-hook.yaml
    target:
      group: batch
      version: v1
      kind: Job
      name: migrate
  - path: workload-wave.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(apigateway|auth|banner|cart|category|email|merchant|merchant-award|merchant-business|merchant-detail|merchant-policy|merchant-social-link|order|order-item|product|review|review-detail|role|shipping-address|slider|stats-reader|stats-writer|transaction|user)$"
  - path: postgres-wave.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: "^(postgres-identity|postgres-merchant|postgres-catalog|postgres-sales|postgres-experience|postgres-email)$"
  - path: pgbouncer-wave.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(pgbouncer-identity|pgbouncer-merchant|pgbouncer-catalog|pgbouncer-sales|pgbouncer-experience|pgbouncer-email)$"