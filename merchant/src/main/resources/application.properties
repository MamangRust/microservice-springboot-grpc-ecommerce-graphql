spring.application.name=merchant-service
spring.datasource.url=jdbc:postgresql://${MERCHANT_DB_HOST:localhost}:${MERCHANT_DB_PORT:5433}/${MERCHANT_DB_NAME:example_jpa_ecommerce}
spring.datasource.username=${MERCHANT_DB_USER:postgres}
spring.datasource.password=${MERCHANT_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9103

# gRPC client -> user service
grpc.client.user.host=${USER_SERVICE_HOST:localhost}
grpc.client.user.port=${USER_SERVICE_PORT:9102}

# ---- Kafka (transactional outbox relay) ----
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
kafka.acks=${KAFKA_ACKS:all}
kafka.enable.idempotence=${KAFKA_ENABLE_IDEMPOTENCE:true}
kafka.retries=${KAFKA_RETRIES:10}
kafka.retry.backoff.ms=${KAFKA_RETRY_BACKOFF_MS:500}
kafka.max.in.flight.requests.per.connection=${KAFKA_MAX_IN_FLIGHT:5}
kafka.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:120000}
kafka.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:30000}
kafka.compression.type=${KAFKA_COMPRESSION_TYPE:lz4}
kafka.linger.ms=${KAFKA_LINGER_MS:5}
kafka.batch.size=${KAFKA_BATCH_SIZE:16384}
kafka.max.block.ms=${KAFKA_MAX_BLOCK_MS:60000}

# Outbox relay tuning + lease
app.outbox.poll-ms=${MERCHANT_OUTBOX_POLL_MS:1000}
app.outbox.initial-delay-ms=${MERCHANT_OUTBOX_INITIAL_DELAY_MS:5000}
merchant.outbox.batch-size=${MERCHANT_OUTBOX_BATCH_SIZE:50}
merchant.outbox.lease.seconds=${MERCHANT_OUTBOX_LEASE_SECONDS:300}

# JWT
springjwt.app.jwtSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31
springjwt.app.jwtRefreshSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32
springjwt.app.jwtExpirationMs=86400000
springjwt.app.jwtRefreshExpirationMs=86400000
