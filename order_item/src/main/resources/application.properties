spring.application.name=order-item-service
spring.datasource.url=jdbc:postgresql://${ORDER_ITEM_DB_HOST:localhost}:${ORDER_ITEM_DB_PORT:5433}/${ORDER_ITEM_DB_NAME:example_jpa_ecommerce}
spring.datasource.username=${ORDER_ITEM_DB_USER:postgres}
spring.datasource.password=${ORDER_ITEM_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9115

