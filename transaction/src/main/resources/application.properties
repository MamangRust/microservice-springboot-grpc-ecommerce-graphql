spring.application.name=transaction-service
spring.datasource.url=jdbc:postgresql://${TRANSACTION_DB_HOST:localhost}:${TRANSACTION_DB_PORT:5433}/${TRANSACTION_DB_NAME:example_jpa_ecommerce}
spring.datasource.username=${TRANSACTION_DB_USER:postgres}
spring.datasource.password=${TRANSACTION_DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# gRPC server
grpc.server.port=9119

# gRPC client -> merchant service
grpc.client.merchant.host=${MERCHANT_SERVICE_HOST:localhost}
grpc.client.merchant.port=${MERCHANT_SERVICE_PORT:9103}

# gRPC client -> order service
grpc.client.order.host=${ORDER_SERVICE_HOST:localhost}
grpc.client.order.port=${ORDER_SERVICE_PORT:9114}

# gRPC client -> order-item service
grpc.client.order-item.host=${ORDER_ITEM_SERVICE_HOST:localhost}
grpc.client.order-item.port=${ORDER_ITEM_SERVICE_PORT:9115}

# gRPC client -> shipping-address service
grpc.client.shipping-address.host=${SHIPPING_ADDRESS_SERVICE_HOST:localhost}
grpc.client.shipping-address.port=${SHIPPING_ADDRESS_SERVICE_PORT:9118}

# gRPC client -> user service (transaction email recipient lookup)
grpc.client.user.host=${USER_SERVICE_HOST:localhost}
grpc.client.user.port=${USER_SERVICE_PORT:9102}

# ---- Kafka (transactional outbox relay) ----
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
kafka.acks=${KAFKA_ACKS:all}
kafka.enable.idempotence=${KAFKA_ENABLE_IDEMPOTENCE:true}
kafka.retries=${KAFKA_RETRIES:10}
kafka.retry.backoff.ms=${KAFKA_RETRY_BACKOFF_MS:500}
kafka.max.in.flight.requests.per.connection=${KAFKA_MAX_IN_FLIGHT:5}
kafka.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:120000}
kafka.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:30000}
kafka.compression.type=${KAFKA_COMPRESSION_TYPE:lz4}
kafka.linger.ms=${KAFKA_LINGER_MS:5}
kafka.batch.size=${KAFKA_BATCH_SIZE:16384}
kafka.max.block.ms=${KAFKA_MAX_BLOCK_MS:60000}

# Outbox relay tuning + lease
app.outbox.poll-ms=${TRANSACTION_OUTBOX_POLL_MS:1000}
app.outbox.initial-delay-ms=${TRANSACTION_OUTBOX_INITIAL_DELAY_MS:5000}
transaction.outbox.batch-size=${TRANSACTION_OUTBOX_BATCH_SIZE:50}
transaction.outbox.lease.seconds=${TRANSACTION_OUTBOX_LEASE_SECONDS:300}

# JWT
springjwt.app.jwtSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c31
springjwt.app.jwtRefreshSecret=0a5371c29751174b5601acb50153c0e66e4f6d6525ed08485e63d94a70985c32
springjwt.app.jwtExpirationMs=86400000
springjwt.app.jwtRefreshExpirationMs=86400000
